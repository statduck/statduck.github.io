    Experience:
      - company: Yonsei University
        position: Graduate Researcher — advised by Prof. Kyungwoo Song
        start_date: 2024-03
        end_date: 2025-12
        highlights:
          - Developed FANS (Function And Noise Separation), a framework using normalizing
            flows to detect and dissect causal mechanism shifts into changes in the causal
            function or the noise distribution.
          - Proposed a statistical criterion based on independence between flow-generated
            noise residuals and parent variables to distinguish function-driven and noise-driven
            shifts in structural causal models.
          - Filed a Korean patent application, *Method and Apparatus for Detecting and
            Analyzing Causal Mechanism Shifts* (pending).
      - company: Vaccine Safety and Causality Monitoring Project
        position: Graduate Researcher — advised by Prof. Kyungwoo Song
        start_date: 2024-03
        end_date: 2025-12
        summary: Establishment of a monitoring system and methodology to verify the
          causality of adverse reactions of major interest after vaccination.
        highlights:
          - Designed static and dynamic scoring models for post-acute sequelae of SARS-CoV-2
            (PASC) in a Korean cohort using logistic lasso and functional logistic lasso
            regression; identified differences in chest pain scores among Omicron wave
            sub-cohorts.
          - Constructed a dynamic scoring system with time-varying coefficients based
            on Functional Principal Component Analysis (FPCA) of longitudinal data.
      - company: Global Research on Regulatory Evaluation of Biohealth Products
        position: Research Project Participant
        start_date: 2024-04
        end_date: 2026-02
        summary: Global Collaborative Research for Advancing Regulatory Science and
          Technology in Safety and Efficacy Evaluation of Biohealth Products, funded
          by the Ministry of Food and Drug Safety, Korea.
        highlights:
          - "Presented chapters of *Causal Inference: What If* in a bi-weekly seminar
            and presented on detecting mechanism shifts to identify unmeasured confounders."
      - company: NAVER FINANCIAL
        position: Data Analyst
        location: Seoul, South Korea
        start_date: 2022-10
        end_date: 2024-02
        highlights:
          - Engineered a data mart and time-series forecasting models to automate reporting;
            developed interactive controllers for a commerce expert and integrated outputs
            into dashboards for proactive risk detection.
          - Analyzed Naver Pay payment trends and simulated promotion scenarios to support
            business decisions.
      - company: CC&I Research
        position: Student Research Assistant (work-study)
        location: Seoul, South Korea
        start_date: 2020-03
        end_date: 2021-02
        highlights:
          - Evaluated non-inferiority of a client's new device against the original using
            the Wilcoxon signed-rank test to compare study endpoints.
